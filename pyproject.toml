[project]
name = "concept-learning"
version = "0.1.0"
description = "Discovering concepts learned by an image classifier with Sparse Autoencoders (CUB-200-2011)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pytorchcv>=0.0.74",
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
cpu = ["torch>=2.7", "torchvision>=0.22"]
cu128 = ["torch>=2.7", "torchvision>=0.22"]

[dependency-groups]
dev = ["pytest>=8.3", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_learning"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
